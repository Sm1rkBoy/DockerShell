services:
    redis:
        image: redis:latest
        container_name: redis
        restart: on-failure:3
        networks:
            universal: null
        volumes:
            - /opt/docker/redis/apps:/data/
            - /opt/docker/redis/config/redis.conf:/usr/local/etc/redis/redis.conf:ro
        command:
            - redis-server
            - /usr/local/etc/redis/redis.conf
        # ports:
        #   - 6379:6379
networks:
    universal:
        external: true
